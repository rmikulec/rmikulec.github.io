name: Deploy portfolio to GitHub Pages

on:
  # Redeploy on every push to main
  push:
    branches: [main]
  # Nightly rebuild so .portfolio edits in other repos get picked up
  schedule:
    - cron: "0 6 * * *"
  # Let other repos trigger a rebuild when their .portfolio changes
  #   curl -X POST -H "Authorization: Bearer $TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/rmikulec/rmikulec.github.io/dispatches \
  #     -d '{"event_type":"portfolio-updated"}'
  repository_dispatch:
    types: [portfolio-updated]
  # Manual "Run workflow" button
  workflow_dispatch:

# Allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer runs cancel in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci

      # Builds the static site. prebuild runs scripts/fetch-portfolio.ts, which
      # reads .portfolio files from all repos (private too, thanks to the token).
      - run: npm run build
        env:
          # A PAT (repo/contents-read scope) so the build can read PRIVATE repos.
          # The auto-injected GITHUB_TOKEN only sees this repo, so we use our own.
          GH_PORTFOLIO_TOKEN: ${{ secrets.GH_PORTFOLIO_TOKEN }}
          GITHUB_USERNAME: rmikulec

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
